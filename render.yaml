# Render deployment for the ProfitLab Quant API.
# Create a new Web Service from this repo and Render reads this file.
services:
  - type: web
    name: quantsistem-api
    runtime: python
    plan: free            # upgrade to "starter" (~$7/mo) to avoid cold starts
    rootDir: .
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROFITLAB_VENDOR
        value: polygon
      - key: POLYGON_BASE_URL
        value: https://api.massive.com
      - key: POLYGON_API_KEY
        sync: false        # set this secret in the Render dashboard, not in git
      - key: ALLOWED_ORIGINS
        value: https://profitlab-academy.com
      # ── accounts / coupons / admin ──
      - key: DATABASE_URL
        sync: false        # mysql+pymysql://user:pass@host:3306/db  (or Postgres/sqlite)
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random secret
      - key: ADMIN_EMAIL
        sync: false        # your admin login email
      - key: ADMIN_PASSWORD
        sync: false        # your admin login password
