# Render deployment for the ProfitLab Quant API.
# Create a new Web Service from this repo and Render reads this file.
services:
  - type: web
    name: quantsistem-api
    runtime: python
    plan: free            # upgrade to "starter" (~$7/mo) to avoid cold starts
    rootDir: .
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROFITLAB_VENDOR
        value: polygon
      - key: POLYGON_BASE_URL
        value: https://api.massive.com
      - key: POLYGON_API_KEY
        sync: false        # set this secret in the Render dashboard, not in git
      - key: ALLOWED_ORIGINS
        value: "*"      # token-protected API; "*" avoids CORS origin issues
      # ── access via the Aula Virtual (coupon / payment) ──
      - key: AULA_API_BASE
        value: https://profitlab-academy.com/aulavirtual/api
      - key: JWT_SECRET
        sync: false        # = the 'jwt_secret' from your Aula's api/config.php
                           # (lets the backend validate sessions locally; the
                           #  Aula API is blocked server-side by SiteGround)
