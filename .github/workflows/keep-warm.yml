name: keep-warm

# Mantiene "despierto" el backend de Render (plan free se duerme tras ~15 min
# de inactividad y tarda ~30-50s en arrancar en frío). Un ping cada 10 min a
# /api/health evita el cold start, así el primer gráfico carga rápido.
#
# El plan free de Render da 750 horas-instancia/mes ≈ un servicio siempre
# activo todo el mes. Si tienes varios servicios free, pueden agotarse antes.
#
# URL del backend: cámbiala si tu servicio Render cambia de nombre.

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo algo)
  workflow_dispatch: {}       # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://profitlab-quant.onrender.com/api/health"
          echo "Pinging $URL"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
          echo "HTTP $code"
          # No fallar el workflow por un cold start lento o un 000 puntual.
          exit 0
