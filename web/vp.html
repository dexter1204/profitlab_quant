<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Volume Profile — ProfitLab Quant</title>
<style>
  :root { --bg:#0e1116; --panel:#141922; --grid:#1f2733; --text:#e6edf3; --text-2:#8b98a9;
          --up:#26a69a; --down:#ef5350; --va:#3b82f6; --poc:#f5c451; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--grid); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:700; letter-spacing:.2px; }
  header .tag { font-size:11px; color:var(--text-2); border:1px solid var(--grid); border-radius:999px; padding:2px 8px; }
  input, button, select { background:var(--panel); color:var(--text); border:1px solid var(--grid); border-radius:8px; padding:7px 10px; font-size:13px; }
  input { width:120px; text-transform:uppercase; }
  button { cursor:pointer; font-weight:600; }
  button:hover { border-color:#3a4658; }
  .wrap { padding:14px 16px; }
  #chart { position:relative; width:100%; height:560px; }
  #vpcanvas { position:absolute; inset:0; pointer-events:none; }
  .stats { display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; color:var(--text-2); font-size:12.5px; }
  .stats b { color:var(--text); font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  .err { color:var(--down); margin-top:10px; min-height:18px; }
  .legend { margin-left:auto; display:flex; gap:14px; font-size:12px; color:var(--text-2); }
</style>
</head>
<body>
<header>
  <h1>Volume Profile</h1>
  <span class="tag" id="mode">—</span>
  <input id="ticker" value="QQQ" spellcheck="false" />
  <select id="bins">
    <option value="30">30 niveles</option>
    <option value="48" selected>48 niveles</option>
    <option value="80">80 niveles</option>
    <option value="120">120 niveles</option>
  </select>
  <button id="go">Cargar</button>
  <span class="legend">
    <span><span class="dot" style="background:var(--poc)"></span>POC</span>
    <span><span class="dot" style="background:var(--va);opacity:.5"></span>Value Area (70%)</span>
  </span>
</header>

<div class="wrap">
  <div id="chart"><canvas id="vpcanvas"></canvas></div>
  <div class="stats" id="stats"></div>
  <div class="err" id="err"></div>
</div>

<script src="config.js"></script>
<script src="lightweight-charts.js"></script>
<script>
(function () {
  "use strict";
  const API = window.PROFITLAB_API || "";
  document.getElementById("mode").textContent =
    window.PROFITLAB_DEMO ? "modo DEMO (datos mock)" : "datos en vivo";

  const el = (id) => document.getElementById(id);
  const chartEl = el("chart"), cv = el("vpcanvas"), ctx = cv.getContext("2d");

  const chart = LightweightCharts.createChart(chartEl, {
    layout: { background: { color: "#0e1116" }, textColor: "#8b98a9" },
    grid: { vertLines: { color: "#1f2733" }, horzLines: { color: "#1f2733" } },
    rightPriceScale: { borderColor: "#1f2733" },
    timeScale: { borderColor: "#1f2733", timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    autoSize: false,
  });
  const candle = chart.addCandlestickSeries({
    upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
    wickUpColor: "#26a69a", wickDownColor: "#ef5350",
  });

  let VP = null;                 // último perfil cargado
  let priceLines = [];

  function sizeChart() {
    const w = chartEl.clientWidth, h = chartEl.clientHeight;
    chart.resize(w, h);
    const dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Dibuja el histograma de volumen por precio, anclado al borde derecho del
  // área de velas (sin pisar la escala de precios).
  function drawVP() {
    const w = chartEl.clientWidth, h = chartEl.clientHeight;
    ctx.clearRect(0, 0, w, h);
    if (!VP) return;
    const psW = chart.priceScale("right").width() || 0;
    const rightEdge = w - psW - 2;
    const maxBarW = Math.min(0.42 * (w - psW), 320);
    const maxVol = Math.max.apply(null, VP.volume) || 1;

    // altura de un bin en px (de la escala de precios)
    const step = VP.price.length > 1 ? Math.abs(VP.price[1] - VP.price[0]) : 1;
    for (let i = 0; i < VP.price.length; i++) {
      const p = VP.price[i];
      const yC = candle.priceToCoordinate(p);
      if (yC == null) continue;
      const yTop = candle.priceToCoordinate(p + step / 2);
      const yBot = candle.priceToCoordinate(p - step / 2);
      const bh = (yTop != null && yBot != null) ? Math.max(1, Math.abs(yBot - yTop) - 1) : 3;
      const bw = (VP.volume[i] / maxVol) * maxBarW;
      const inVA = p >= VP.val && p <= VP.vah;
      const isPOC = Math.abs(p - VP.poc) <= step / 2;
      ctx.fillStyle = isPOC ? "rgba(245,196,81,0.85)" : (inVA ? "rgba(59,130,246,0.45)" : "rgba(120,135,156,0.30)");
      ctx.fillRect(rightEdge - bw, yC - bh / 2, bw, bh);
    }
  }

  function setLines() {
    priceLines.forEach((l) => candle.removePriceLine(l));
    priceLines = [];
    if (!VP) return;
    const add = (price, color, title, style) => priceLines.push(candle.createPriceLine({
      price, color, lineWidth: style === "solid" ? 2 : 1,
      lineStyle: style === "solid" ? 0 : 2, axisLabelVisible: true, title,
    }));
    add(VP.poc, "#f5c451", "POC", "solid");
    add(VP.vah, "#3b82f6", "VAH", "dash");
    add(VP.val, "#3b82f6", "VAL", "dash");
  }

  async function load() {
    const t = (el("ticker").value || "QQQ").trim().toUpperCase();
    const bins = el("bins").value;
    el("err").textContent = "";
    try {
      const headers = (window.PLAuth && window.PLAuth.headers) ? window.PLAuth.headers() : {};
      const res = await fetch(`${API}/api/volume_profile/${t}?bins=${bins}`, { headers });
      const d = await res.json();
      if (!res.ok) throw new Error(d.detail || `HTTP ${res.status}`);
      VP = d;
      candle.setData(d.candles.map((c) => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));
      chart.timeScale().fitContent();
      setLines();
      requestAnimationFrame(drawVP);
      renderStats(d);
    } catch (e) {
      VP = null; drawVP();
      el("err").textContent = "No se pudo cargar: " + e.message;
    }
  }

  function renderStats(d) {
    const f = (x) => Number(x).toLocaleString("es", { maximumFractionDigits: 2 });
    el("stats").innerHTML =
      `<span><b>${d.ticker}</b> · spot <b>${f(d.spot)}</b></span>` +
      `<span>POC <b>${f(d.poc)}</b></span>` +
      `<span>Value Area <b>${f(d.val)} – ${f(d.vah)}</b> (70%)</span>` +
      `<span>Rango sesión <b>${f(d.low)} – ${f(d.high)}</b></span>` +
      `<span>Vol total <b>${f(d.total_volume)}</b> · ${d.bins} niveles</span>`;
  }

  // Redibujar el overlay en interacciones que cambian la escala.
  chart.timeScale().subscribeVisibleTimeRangeChange(() => requestAnimationFrame(drawVP));
  chartEl.addEventListener("wheel", () => requestAnimationFrame(drawVP), { passive: true });
  new ResizeObserver(() => { sizeChart(); requestAnimationFrame(drawVP); }).observe(chartEl);

  el("go").addEventListener("click", load);
  el("ticker").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });

  sizeChart();
  load();
})();
</script>
</body>
</html>
