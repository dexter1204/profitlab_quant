<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ProfitLab Quant — Acceso</title>
<style>
  :root{--bg:#05070b;--panel:#0b1220;--border:#1f2937;--muted:#64748b;--text:#e2e8f0;
    --text-strong:#f8fafc;--green:#22c55e;--green-soft:#4ade80;--red:#ef4444;--red-soft:#f87171;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 700px at 20% -20%, #0b1220 0%, var(--bg) 60%);
    color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:24px}
  .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .brand{font-size:22px;font-weight:700;color:var(--text-strong);letter-spacing:.04em;text-align:center}
  .brand span{color:var(--green)}
  .sub{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-align:center;margin-top:4px;font-weight:600}
  .note{color:var(--muted);font-size:12.5px;line-height:1.5;text-align:center;margin:18px 0 6px}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 5px}
  input{width:100%;background:#070b12;color:var(--text-strong);border:1px solid var(--border);
    border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14px}
  input:focus{outline:none;border-color:var(--green)}
  button.primary{width:100%;margin-top:20px;background:var(--green);color:#04120a;border:0;border-radius:9px;
    padding:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  button.primary:hover{background:var(--green-soft)}
  button.primary:disabled{opacity:.6;cursor:default}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none}
  .msg.err{display:block;background:rgba(239,68,68,.1);border:1px solid var(--red);color:var(--red-soft)}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}
  .hint a{color:var(--green-soft);text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Profit<span>Lab</span> Quant</div>
    <div class="sub">Gamma &amp; Beta Exposure</div>
    <p class="note">Entra con tu cuenta del <b style="color:var(--text)">Aula Virtual</b> (el mismo email y contraseña).</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" />
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />

    <button class="primary" id="loginBtn">Entrar</button>
    <div class="msg" id="msg"></div>
    <div class="hint" id="signupHint"></div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
  (function () {
    const A = window.PLAuth;
    const $ = (id) => document.getElementById(id);
    const showMsg = (t) => { const m = $("msg"); m.textContent = t; m.className = "msg err"; };

    // If already signed in to the quant, go straight in.
    if (A.getToken()) location.href = "index.html";

    const su = (A.AULA && A.AULA.signupUrl);
    if (su) $("signupHint").innerHTML = `¿No tienes cuenta? <a href="${su}">Regístrate en el Aula</a>`;

    async function submit() {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) { showMsg("Completa email y contraseña."); return; }
      $("loginBtn").disabled = true;
      try {
        await A.login(email, password);
        location.href = "index.html";
      } catch (e) {
        showMsg(e.message || "No se pudo iniciar sesión.");
      } finally {
        $("loginBtn").disabled = false;
      }
    }
    $("loginBtn").addEventListener("click", submit);
    $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    $("email").addEventListener("keydown", (e) => { if (e.key === "Enter") $("password").focus(); });
  })();
  </script>
</body>
</html>
