<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProfitLab Quant — Acceso</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .login { width: 100%; max-width: 408px; padding: 40px 36px 34px; }
  .login .brand { font-size: 26px; text-align: center; }
  .login .sub { color: var(--text-3); font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    text-align: center; margin-top: 6px; font-weight: 650; }
  .login .note { color: var(--text-2); font-size: 14px; line-height: 1.55; text-align: center; margin: 22px 0 8px; }
  .login .note b { color: var(--text); }
  .login .field { margin-top: 16px; }
  .hint { color: var(--text-2); font-size: 13px; text-align: center; margin-top: 20px; }
  .corner { position: fixed; top: 20px; right: 24px; }
</style>
</head>
<body>
  <button id="themeToggle" class="corner"></button>

  <main class="card login rise">
    <div class="brand">Profit<span>Lab</span> Quant</div>
    <div class="sub">Gamma &amp; Beta Exposure</div>
    <p class="note">Entra con tu cuenta del <b>Aula Virtual</b> (el mismo email y contraseña).</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>

    <button class="btn primary block" id="loginBtn" style="margin-top:22px">Entrar</button>
    <div class="msg" id="msg"></div>
    <div class="hint" id="signupHint"></div>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
  (function () {
    const A = window.PLAuth;
    const $ = (id) => document.getElementById(id);
    const showMsg = (t) => { const m = $("msg"); m.textContent = t; m.className = "msg err"; };

    // If already signed in to the quant, go straight in.
    if (A.getToken()) location.href = "index.html";

    const su = (A.AULA && A.AULA.signupUrl);
    if (su) $("signupHint").innerHTML = `¿No tienes cuenta? <a href="${su}">Regístrate en el Aula</a>`;

    async function submit() {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) { showMsg("Completa email y contraseña."); return; }
      $("loginBtn").disabled = true;
      try {
        await A.login(email, password);
        location.href = "index.html";
      } catch (e) {
        showMsg(e.message || "No se pudo iniciar sesión.");
      } finally {
        $("loginBtn").disabled = false;
      }
    }
    $("loginBtn").addEventListener("click", submit);
    $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    $("email").addEventListener("keydown", (e) => { if (e.key === "Enter") $("password").focus(); });
  })();
  </script>
</body>
</html>
