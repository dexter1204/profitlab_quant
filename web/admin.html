<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ProfitLab Quant — Administración</title>
<style>
  :root{
    --bg:#05070b; --panel:#0b1220; --border:#1f2937; --grid:#111a2b; --muted:#64748b;
    --text:#e2e8f0; --text-strong:#f8fafc; --green:#22c55e; --green-soft:#4ade80;
    --red:#ef4444; --red-soft:#f87171; --amber:#f59e0b; --cyan:#06b6d4;
  }
  *{box-sizing:border-box}
  body{margin:0; background:radial-gradient(1200px 700px at 20% -20%, #0b1220 0%, var(--bg) 60%);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; padding:14px 18px 50px}
  .topbar{display:flex; gap:14px; align-items:center; flex-wrap:wrap;
    border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:16px}
  .brand{font-size:18px; font-weight:700; color:var(--text-strong); letter-spacing:.04em}
  .brand span{color:var(--green)}
  .badge{padding:3px 8px; border-radius:4px; font-size:10px; letter-spacing:.14em; font-weight:700;
    text-transform:uppercase; border:1px solid var(--amber); color:var(--amber); background:rgba(245,158,11,.1)}
  .spacer{flex:1}
  .linkbtn{appearance:none; background:transparent; border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:7px 12px; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer}
  .linkbtn:hover{border-color:var(--muted)}
  h2{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:24px 0 10px}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; overflow-x:auto}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:6px}
  .field{display:flex; flex-direction:column; gap:4px}
  .field label{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700}
  input, select{background:#070b12; color:var(--text-strong); border:1px solid var(--border);
    border-radius:8px; padding:9px 11px; font-family:inherit; font-size:13px}
  input:focus, select:focus{outline:none; border-color:var(--green)}
  button.go{background:var(--green); color:#04120a; border:0; border-radius:8px; padding:9px 16px;
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer}
  button.go:hover{background:var(--green-soft)}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px}
  th{text-align:left; color:var(--muted); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border)}
  td{padding:9px 10px; border-bottom:1px solid var(--grid); vertical-align:middle}
  td.code{font-weight:700; letter-spacing:.08em; color:var(--text-strong); font-variant-numeric:tabular-nums}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700}
  .pill.on{background:rgba(34,197,94,.12); color:var(--green-soft)}
  .pill.off{background:rgba(239,68,68,.12); color:var(--red-soft)}
  .pill.life{background:rgba(6,182,212,.12); color:var(--cyan)}
  .mini{appearance:none; background:transparent; border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:4px 8px; font-family:inherit; font-size:11px; font-weight:600; cursor:pointer; margin:1px}
  .mini:hover{border-color:var(--muted)}
  .mini.danger{color:var(--red-soft); border-color:rgba(239,68,68,.4)}
  .mini.good{color:var(--green-soft); border-color:rgba(34,197,94,.4)}
  .msg{font-size:13px; padding:9px 12px; border-radius:8px; margin-top:10px; display:none}
  .msg.err{display:block; background:rgba(239,68,68,.1); border:1px solid var(--red); color:var(--red-soft)}
  .msg.ok{display:block; background:rgba(34,197,94,.1); border:1px solid var(--green); color:var(--green-soft)}
  .muted{color:var(--muted)}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Profit<span>Lab</span> Quant</div>
    <span class="badge">Admin</span>
    <span class="spacer"></span>
    <button class="linkbtn" onclick="location.href='index.html'">← Dashboard</button>
    <button class="linkbtn" id="logoutBtn">Cerrar sesión</button>
  </div>

  <!-- ── CUPONES ── -->
  <h2>Cupones</h2>
  <div class="panel">
    <div class="row">
      <div class="field">
        <label>Código (opcional)</label>
        <input id="cCode" type="text" placeholder="auto" style="width:140px; text-transform:uppercase" />
      </div>
      <div class="field">
        <label>Duración</label>
        <select id="cDur">
          <option value="30">30 días</option>
          <option value="90">90 días</option>
          <option value="180">180 días</option>
          <option value="365">1 año</option>
          <option value="0">Vitalicio</option>
          <option value="custom">Personalizado…</option>
        </select>
      </div>
      <div class="field" id="cCustomWrap" style="display:none">
        <label>Días</label>
        <input id="cCustom" type="number" min="1" value="45" style="width:90px" />
      </div>
      <div class="field">
        <label>Usos máximos</label>
        <input id="cMax" type="number" min="1" value="1" style="width:90px" />
      </div>
      <div class="field">
        <label>Nota (opcional)</label>
        <input id="cNote" type="text" placeholder="promo lanzamiento" style="width:180px" />
      </div>
      <button class="go" id="cCreate">Crear cupón</button>
    </div>
    <div class="msg" id="cMsg"></div>
    <table style="margin-top:12px">
      <thead><tr><th>Código</th><th>Duración</th><th>Usos</th><th>Estado</th><th>Nota</th><th>Creado</th><th></th></tr></thead>
      <tbody id="cBody"><tr><td colspan="7" class="muted">Cargando…</td></tr></tbody>
    </table>
  </div>

  <!-- ── ALUMNOS ── -->
  <h2>Alumnos</h2>
  <div class="panel">
    <div class="msg" id="sMsg"></div>
    <table>
      <thead><tr><th>Email</th><th>Nombre</th><th>Acceso</th><th>Cuenta</th><th>Registro</th><th>Gestionar acceso</th></tr></thead>
      <tbody id="sBody"><tr><td colspan="6" class="muted">Cargando…</td></tr></tbody>
    </table>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
  (function () {
    const A = window.PLAuth;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

    function msg(el, text, kind) { const m = $(el); m.textContent = text; m.className = "msg " + (kind || "err"); if (text) setTimeout(() => { m.className = "msg"; }, 4000); }
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("es", { year:"numeric", month:"short", day:"numeric" }) : "—";

    function accessCell(u) {
      if (u.lifetime) return '<span class="pill life">Vitalicio</span>';
      if (!u.access_until) return '<span class="pill off">Sin acceso</span>';
      const active = u.has_access;
      return `<span class="pill ${active ? "on" : "off"}">${active ? "Activo" : "Vencido"}</span> <span class="muted">${fmtDate(u.access_until)}</span>`;
    }

    async function loadCoupons() {
      try {
        const d = await A.apiGet("/api/admin/coupons");
        const rows = d.coupons.map((c) => `
          <tr>
            <td class="code">${esc(c.code)}</td>
            <td>${c.lifetime ? "Vitalicio" : c.duration_days + " días"}</td>
            <td>${c.uses}/${c.max_uses} <span class="muted">(${c.remaining} libres)</span></td>
            <td><span class="pill ${c.active ? "on" : "off"}">${c.active ? "Activo" : "Inactivo"}</span></td>
            <td class="muted">${esc(c.note)}</td>
            <td class="muted">${fmtDate(c.created_at)}</td>
            <td><button class="mini" data-ct="${c.id}">${c.active ? "Desactivar" : "Activar"}</button></td>
          </tr>`).join("");
        $("cBody").innerHTML = rows || '<tr><td colspan="7" class="muted">Aún no hay cupones.</td></tr>';
        for (const b of $("cBody").querySelectorAll("[data-ct]"))
          b.addEventListener("click", () => toggleCoupon(b.dataset.ct));
      } catch (e) { msg("cMsg", e.message); }
    }

    async function createCoupon() {
      const durSel = $("cDur").value;
      const duration_days = durSel === "custom" ? parseInt($("cCustom").value || "0", 10) : parseInt(durSel, 10);
      const body = {
        code: $("cCode").value.trim(),
        duration_days: isNaN(duration_days) ? 30 : duration_days,
        max_uses: parseInt($("cMax").value || "1", 10),
        note: $("cNote").value.trim(),
      };
      try {
        const d = await A.apiPost("/api/admin/coupons", body);
        msg("cMsg", "Cupón creado: " + d.coupon.code, "ok");
        $("cCode").value = ""; $("cNote").value = "";
        loadCoupons();
      } catch (e) { msg("cMsg", e.message); }
    }

    async function toggleCoupon(id) {
      try { await A.apiPost(`/api/admin/coupons/${id}/toggle`); loadCoupons(); }
      catch (e) { msg("cMsg", e.message); }
    }

    async function loadStudents() {
      try {
        const d = await A.apiGet("/api/admin/students");
        const rows = d.students.map((u) => `
          <tr>
            <td>${esc(u.email)}${u.is_admin ? ' <span class="pill life">admin</span>' : ""}</td>
            <td>${esc(u.name)}</td>
            <td>${accessCell(u)}</td>
            <td><span class="pill ${u.active ? "on" : "off"}">${u.active ? "Activa" : "Bloqueada"}</span></td>
            <td class="muted">${fmtDate(u.created_at)}</td>
            <td>
              ${u.is_admin ? '<span class="muted">—</span>' : `
              <button class="mini good" data-ext="${u.id}" data-days="30">+30d</button>
              <button class="mini good" data-ext="${u.id}" data-days="90">+90d</button>
              <button class="mini good" data-ext="${u.id}" data-days="365">+1año</button>
              <button class="mini" data-life="${u.id}">Vitalicio</button>
              <button class="mini danger" data-rev="${u.id}">Revocar</button>
              <button class="mini" data-tog="${u.id}">${u.active ? "Bloquear" : "Reactivar"}</button>`}
            </td>
          </tr>`).join("");
        $("sBody").innerHTML = rows || '<tr><td colspan="6" class="muted">Aún no hay alumnos.</td></tr>';
        const tb = $("sBody");
        for (const b of tb.querySelectorAll("[data-ext]"))
          b.addEventListener("click", () => setAccess(b.dataset.ext, { extend_days: parseInt(b.dataset.days, 10) }));
        for (const b of tb.querySelectorAll("[data-life]"))
          b.addEventListener("click", () => setAccess(b.dataset.life, { lifetime: true }));
        for (const b of tb.querySelectorAll("[data-rev]"))
          b.addEventListener("click", () => { if (confirm("¿Revocar el acceso de este alumno?")) setAccess(b.dataset.rev, { revoke: true }); });
        for (const b of tb.querySelectorAll("[data-tog]"))
          b.addEventListener("click", () => toggleStudent(b.dataset.tog));
      } catch (e) { msg("sMsg", e.message); }
    }

    async function setAccess(id, body) {
      try { await A.apiPost(`/api/admin/students/${id}/access`, body); loadStudents(); }
      catch (e) { msg("sMsg", e.message); }
    }
    async function toggleStudent(id) {
      try { await A.apiPost(`/api/admin/students/${id}/toggle`); loadStudents(); }
      catch (e) { msg("sMsg", e.message); }
    }

    // boot
    A.guard({ admin: true }).then((user) => {
      if (!user) return;
      $("cDur").addEventListener("change", () => {
        $("cCustomWrap").style.display = $("cDur").value === "custom" ? "flex" : "none";
      });
      $("cCreate").addEventListener("click", createCoupon);
      $("logoutBtn").addEventListener("click", () => A.logout());
      loadCoupons();
      loadStudents();
    });
  })();
  </script>
</body>
</html>
