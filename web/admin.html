<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProfitLab Quant — Cupones</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css" />
<style>
  body { padding: 0; }
  .topbar { position: sticky; top: 0; z-index: 30; }
  .topbar .row { display: flex; gap: 14px; align-items: center; height: 64px; }
  .badge { padding: 4px 10px; border-radius: var(--r-pill); font-size: 10px; letter-spacing: .14em; font-weight: 700;
    text-transform: uppercase; border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); color: var(--amber);
    background: color-mix(in srgb, var(--amber) 12%, transparent); }
  .spacer { flex: 1; }
  main.wrap { padding-top: var(--s5); padding-bottom: var(--s6); }
  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-weight: 650; margin: 28px 0 12px; }
  .panel { overflow-x: auto; }
  .row.form { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .field input, .field select { min-height: 44px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
  th { text-align: left; color: var(--text-3); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 650; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 11px 12px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
  td.code { font-weight: 650; letter-spacing: .06em; color: var(--text); }
  .mini { appearance: none; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 6px 12px; font-family: inherit; font-size: 12px; font-weight: 550; cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--spring); }
  .mini:hover { border-color: var(--text-3); } .mini:active { transform: scale(.96); }
</style>
</head>
<body>
  <header class="topbar material"><div class="wrap row">
    <div class="brand">Profit<span>Lab</span> Quant</div>
    <span class="badge">Cupones</span>
    <span class="spacer"></span>
    <button id="themeToggle"></button>
    <button class="btn ghost" onclick="location.href='index.html'">← Dashboard</button>
    <button class="btn ghost" id="logoutBtn">Cerrar sesión</button>
  </div></header>

  <main class="wrap">
    <h2>Crear / gestionar cupones</h2>
    <div class="panel">
      <div class="row form">
        <div class="field"><label>Código (opcional)</label><input id="cCode" type="text" placeholder="auto" style="width:150px;text-transform:uppercase" /></div>
        <div class="field"><label>Duración</label>
          <div class="selector"><select id="cDur"><option value="30">30 días</option><option value="90">90 días</option><option value="180">180 días</option><option value="365">1 año</option><option value="0">Vitalicio</option><option value="custom">Personalizado…</option></select><span class="chev">▾</span></div>
        </div>
        <div class="field" id="cCustomWrap" style="display:none"><label>Días</label><input id="cCustom" type="number" min="1" value="45" style="width:96px" /></div>
        <div class="field"><label>Usos máximos</label><input id="cMax" type="number" min="1" value="1" style="width:96px" /></div>
        <div class="field"><label>Nota (opcional)</label><input id="cNote" type="text" placeholder="promo lanzamiento" style="width:190px" /></div>
        <button class="btn primary" id="cCreate">Crear cupón</button>
      </div>
      <div class="msg" id="cMsg"></div>
      <table style="margin-top:16px">
        <thead><tr><th>Código</th><th>Duración</th><th>Usos</th><th>Estado</th><th>Nota</th><th></th></tr></thead>
        <tbody id="cBody"><tr><td colspan="6" class="muted">Cargando…</td></tr></tbody>
      </table>
    </div>

    <h2>Alumnos con acceso</h2>
    <div class="panel">
      <table>
        <thead><tr><th>Nombre</th><th>Email</th><th>Acceso hasta</th><th>Origen</th></tr></thead>
        <tbody id="sBody"><tr><td colspan="4" class="muted">Cargando…</td></tr></tbody>
      </table>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
  (function () {
    const A = window.PLAuth;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    const msg = (t, k) => { const m = $("cMsg"); m.textContent = t; m.className = "msg " + (k || "err"); if (t) setTimeout(() => m.className = "msg", 4000); };
    const fmtDate = (s) => { if (!s) return "—"; const d = new Date(String(s).replace(" ", "T")); return isNaN(d) ? s : d.toLocaleDateString("es", { year:"numeric", month:"short", day:"numeric" }); };

    async function loadCoupons() {
      try {
        const rows = await A.aula("GET", "/quant/coupons");
        $("cBody").innerHTML = (rows.length ? rows.map((c) => `
          <tr><td class="code">${esc(c.code)}</td>
            <td>${c.lifetime ? "Vitalicio" : c.duration_days + " días"}</td>
            <td>${c.uses}/${c.max_uses} <span class="muted">(${c.remaining} libres)</span></td>
            <td><span class="pill ${c.active ? "on" : "off"}">${c.active ? "Activo" : "Inactivo"}</span></td>
            <td class="muted">${esc(c.note)}</td>
            <td><button class="mini" data-t="${c.id}">${c.active ? "Desactivar" : "Activar"}</button></td></tr>`).join("")
          : '<tr><td colspan="6" class="muted">Aún no hay cupones.</td></tr>');
        for (const b of $("cBody").querySelectorAll("[data-t]"))
          b.addEventListener("click", async () => { try { await A.aula("POST", `/quant/coupons/${b.dataset.t}/toggle`); loadCoupons(); } catch (e) { msg(e.message); } });
      } catch (e) { msg(e.message); }
    }

    async function loadAccess() {
      try {
        const rows = await A.aula("GET", "/quant/access");
        $("sBody").innerHTML = (rows.length ? rows.map((r) => `
          <tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${fmtDate(r.access_until)}</td>
            <td><span class="pill ${r.source === "coupon" ? "on" : (r.source === "mercadopago" ? "life" : "")}">${esc(r.source)}</span></td></tr>`).join("")
          : '<tr><td colspan="4" class="muted">Aún no hay alumnos con acceso.</td></tr>');
      } catch (e) { /* non-fatal */ }
    }

    async function createCoupon() {
      const sel = $("cDur").value;
      const duration_days = sel === "custom" ? parseInt($("cCustom").value || "0", 10) : parseInt(sel, 10);
      try {
        const c = await A.aula("POST", "/quant/coupons", {
          code: $("cCode").value.trim(), duration_days: isNaN(duration_days) ? 30 : duration_days,
          max_uses: parseInt($("cMax").value || "1", 10), note: $("cNote").value.trim(),
        });
        msg("Cupón creado: " + c.code, "ok"); $("cCode").value = ""; $("cNote").value = "";
        loadCoupons();
      } catch (e) { msg(e.message); }
    }

    // admin-only guard (does NOT paywall — admins manage even without access)
    (async function () {
      if (!A.getToken()) { A.goLogin(); return; }
      let me;
      try { me = await A.aula("GET", "/quant/me"); }
      catch (e) { if (e.status === 401) { A.clearToken(); A.goLogin(); } return; }
      if (!me.user || me.user.role !== "admin") { location.href = "index.html"; return; }
      $("cDur").addEventListener("change", () => { $("cCustomWrap").style.display = $("cDur").value === "custom" ? "flex" : "none"; });
      $("cCreate").addEventListener("click", createCoupon);
      $("logoutBtn").addEventListener("click", () => A.logout());
      loadCoupons(); loadAccess();
    })();
  })();
  </script>
</body>
</html>
