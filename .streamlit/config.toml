# Streamlit runtime config — read at server boot on Streamlit Community Cloud.
# Theme values match dashboard/styles.py so the initial paint (before our CSS
# injects) already uses the dashboard palette instead of Streamlit defaults.

[theme]
base = "dark"
primaryColor = "#C7F94C"
backgroundColor = "#0a0a0c"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#f5f5f7"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 25
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
